<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahali · {{SLUG}}</title>
<style>
  :root{
    --bg:#070A04; --panel:rgba(17,69,2,.34); --panel2:rgba(0,0,0,.34);
    --line:rgba(255,255,255,.08); --text:#EAF7E4; --muted:#9fb59a;
    --lime:#99FF0B; --olive:#114502;
    --temp:#F5A524; --hum:#22D3EE; --ph:#86EFAC; --water:#3B82F6; --danger:#ff6b6b;
    --rail:60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;display:flex;height:100vh}

  /* --- Barre de navigation verticale (paysage) --- */
  .rail{width:var(--rail);flex:0 0 var(--rail);background:var(--panel2);border-right:1px solid var(--line);
        display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--olive);display:flex;align-items:center;
        justify-content:center;margin-bottom:8px}
  .logo svg{width:22px;height:22px}
  .nav{width:46px;height:46px;border-radius:14px;border:none;background:transparent;color:var(--muted);
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .nav svg{width:20px;height:20px}
  .nav span{font-size:8.5px;font-weight:700}
  .nav.active{background:rgba(153,255,11,.15);color:var(--lime)}

  /* --- Zone de contenu --- */
  .main{flex:1;overflow:hidden;position:relative}
  .page{position:absolute;inset:0;padding:10px 12px;overflow-y:auto;display:none}
  .page.active{display:block}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .top h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.4px}
  .top .sub{font-size:10px;color:var(--muted)}
  .pill{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
  .pill.on{background:rgba(153,255,11,.16);color:var(--lime)}
  .pill.off{background:rgba(255,107,107,.16);color:var(--danger)}

  /* --- Jauges (Vue) --- */
  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gauge{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;
         display:flex;align-items:center;gap:8px}
  .gauge .ring{position:relative;width:66px;height:66px;flex:0 0 66px}
  .gauge .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .ring .val b{font-size:15px;font-weight:800;line-height:1}
  .gauge .ring .val i{font-size:8px;color:var(--muted);font-style:normal}
  .gauge .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}

  /* --- Relais (Contrôles) --- */
  .relay{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--panel);
         border:1px solid var(--line);border-radius:13px;margin-bottom:7px}
  .relay .name{font-weight:700;font-size:12px}
  .sw{position:relative;width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.14);border:none;cursor:pointer;transition:.2s;flex:0 0 48px}
  .sw.on{background:var(--lime)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on::after{left:23px}

  /* --- Caméra --- */
  .cam{width:100%;height:100%;object-fit:contain;border-radius:12px;background:#000}
  .camwrap{position:absolute;inset:10px}

  /* --- Système --- */
  .row{display:flex;justify-content:space-between;padding:9px 12px;background:var(--panel);border:1px solid var(--line);
       border-radius:12px;margin-bottom:7px;font-size:12px}
  .row .k{color:var(--muted)} .row .v{font-weight:700}
  .code{font-family:ui-monospace,Menlo,monospace;color:var(--lime)}
  .offline{background:rgba(245,165,36,.14);color:var(--temp);border:1px solid rgba(245,165,36,.3);
           border-radius:10px;padding:7px 10px;font-size:10.5px;margin-bottom:8px;display:none}
</style>
</head>
<body>
  <nav class="rail">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3c4 3 6 6 6 10a6 6 0 0 1-12 0c0-4 2-7 6-10z" fill="#99FF0B"/></svg></div>
    <button class="nav active" data-p="vue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span>Vue</span></button>
    <button class="nav" data-p="ctrl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="8" r="2"/><line x1="9" y1="8" x2="20" y2="8"/><circle cx="17" cy="16" r="2"/><line x1="4" y1="16" x2="15" y2="16"/></svg><span>Relais</span></button>
    <button class="nav" data-p="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.2"/></svg><span>Caméra</span></button>
    <button class="nav" data-p="sys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Système</span></button>
  </nav>

  <div class="main">
    <!-- VUE -->
    <section class="page active" id="p-vue">
      <div class="top"><div><h2 id="ghname">{{SLUG}}</h2><div class="sub">Climat intérieur</div></div><div class="pill" id="st1">…</div></div>
      <div class="offline" id="off1">⚠ Hors-ligne — dernières valeurs connues.</div>
      <div class="gauges" id="gauges"></div>
    </section>

    <!-- CONTRÔLES -->
    <section class="page" id="p-ctrl">
      <div class="top"><div><h2>Relais</h2><div class="sub">Contrôle des équipements</div></div><div class="pill" id="st2">…</div></div>
      <div id="relays"></div>
    </section>

    <!-- CAMÉRA -->
    <section class="page" id="p-cam">
      <div class="camwrap"><img class="cam" id="cam" alt="caméra" src="{{CAMERA}}"
        onerror="this.style.opacity=.3;this.alt='Caméra indisponible'"></div>
    </section>

    <!-- SYSTÈME -->
    <section class="page" id="p-sys">
      <div class="top"><div><h2>Système</h2><div class="sub">Contrôleur Mahali</div></div><div class="pill" id="st3">…</div></div>
      <div class="row"><span class="k">Identifiant</span><span class="v code" id="did">—</span></div>
      <div class="row"><span class="k">Serre</span><span class="v" id="gh2">—</span></div>
      <div class="row"><span class="k">Connexion cloud</span><span class="v" id="cloud">—</span></div>
      <div class="row"><span class="k">Heure</span><span class="v" id="clock">—</span></div>
    </section>
  </div>

<script>
  // Chaque jauge agrège plusieurs clés possibles (zones entrée/centre/sortie) :
  // on affiche la 1re zone qui a une valeur, pour rester robuste si un capteur
  // manque.
  const GROUPS = [
    {l:"Température",u:"°C",c:"--temp",min:0,max:50,keys:["temp_entry","temp_center","temp_exit"]},
    {l:"Humidité",u:"%",c:"--hum",min:0,max:100,keys:["humidity_entry","humidity_center","humidity_exit"]},
    {l:"pH solution",u:"",c:"--ph",min:0,max:14,keys:["ph"]},
    {l:"Réservoir",u:"%",c:"--water",min:0,max:100,keys:["water_level"]},
  ];
  const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = v => v==null? "—" : (Math.round(v*10)/10);

  function pick(sensors, keys){
    for(const k of keys){ if(sensors && sensors[k] && sensors[k].value!=null) return sensors[k].value; }
    return null;
  }

  function ring(m, val){
    const col = cssv(m.c);
    const frac = val==null?0:Math.max(0,Math.min(1,(val-m.min)/(m.max-m.min)));
    const R=28, C=2*Math.PI*R, off=C*(1-frac*0.75), rot=135;
    return `<div class="ring">
      <svg viewBox="0 0 66 66">
        <circle cx="33" cy="33" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"
          stroke-dasharray="${C*0.75} ${C}" transform="rotate(${rot} 33 33)" stroke-linecap="round"/>
        <circle cx="33" cy="33" r="${R}" fill="none" stroke="${col}" stroke-width="6"
          stroke-dasharray="${C*0.75*frac} ${C}" transform="rotate(${rot} 33 33)" stroke-linecap="round"/>
      </svg>
      <div class="val"><b>${fmt(val)}</b><i>${m.u}</i></div></div>`;
  }

  function setStatus(fresh){
    const cls = fresh?"pill on":"pill off", txt = fresh?"en direct":"hors-ligne";
    ["st1","st2","st3"].forEach(id=>{const e=document.getElementById(id);e.className=cls;e.textContent=txt;});
    document.getElementById("off1").style.display = fresh?"none":"block";
  }

  function renderGauges(sensors){
    const g = document.getElementById("gauges"); g.innerHTML="";
    GROUPS.forEach(m=>{
      const v = pick(sensors, m.keys);
      g.insertAdjacentHTML("beforeend",
        `<div class="gauge">${ring(m,v)}<div class="lbl">${m.l}</div></div>`);
    });
  }

  async function tick(){
    try{
      const s = await (await fetch("/api/state")).json();
      setStatus(!!s.fresh);
      renderGauges(s.sensors||{});
      // Relais
      const rd = document.getElementById("relays"); const relays=s.relays||{};
      rd.innerHTML = Object.keys(relays).length?"":'<div class="row"><span class="k">Aucun relais signalé</span></div>';
      Object.keys(relays).sort((a,b)=>a-b).forEach(ch=>{
        const rl=relays[ch];
        rd.insertAdjacentHTML("beforeend",
          `<div class="relay"><div class="name">${rl.name||("Relais "+ch)}</div>
           <button class="sw ${rl.is_on?"on":""}" onclick="toggle(${ch},${!rl.is_on})"></button></div>`);
      });
      // Système
      const d = s.device||{};
      document.getElementById("did").textContent = d.device_id||"—";
      document.getElementById("gh2").textContent = d.greenhouse_name||s.slug||"—";
      document.getElementById("ghname").textContent = d.greenhouse_name||s.slug||"serre";
      document.getElementById("gh2").textContent = d.greenhouse_name||s.slug||"—";
      document.getElementById("cloud").textContent = s.fresh?"synchronisé":"local seulement";
    }catch(e){ setStatus(false); renderGauges({}); }
  }
  renderGauges({});  // squelette immédiat au chargement
  async function toggle(ch,state){
    try{ await fetch(`/api/relay/${ch}/toggle`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state})}); }catch(e){}
    setTimeout(tick,300);
  }

  // Navigation
  let lastTouch=Date.now();
  document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".nav").forEach(n=>n.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("p-"+b.dataset.p).classList.add("active");
    lastTouch=Date.now();
  }));

  // Kiosque : après 3 min d'inactivité, retour à la page Vue.
  ["click","touchstart","keydown"].forEach(ev=>window.addEventListener(ev,()=>lastTouch=Date.now(),{passive:true}));
  setInterval(()=>{ if(Date.now()-lastTouch>180000){ document.querySelector('.nav[data-p="vue"]').click(); } },5000);

  // Horloge + caméra anti-gel
  setInterval(()=>{ document.getElementById("clock").textContent=new Date().toLocaleTimeString("fr-FR"); },1000);
  setInterval(()=>{ const c=document.getElementById("cam"); if(c) c.src="{{CAMERA}}?t="+Date.now(); },180000);

  tick(); setInterval(tick,3000);
</script>
</body>
</html>
