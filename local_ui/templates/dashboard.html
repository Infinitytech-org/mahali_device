<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahali · {{SLUG}}</title>
<style>
  :root{
    --bg:#070A04; --panel:rgba(17,69,2,.34); --line:rgba(255,255,255,.08);
    --text:#EAF7E4; --muted:#9fb59a; --lime:#99FF0B; --olive:#114502;
    --blue:#3B82F6; --cyan:#22D3EE; --amber:#F5A524; --danger:#ff6b6b;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;padding:14px;max-width:820px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:0}
  h1 span{color:var(--lime)}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
  .pill.on{background:rgba(153,255,11,.16);color:var(--lime)}
  .pill.off{background:rgba(255,107,107,.16);color:var(--danger)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(12px)}
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .card .v{font-size:30px;font-weight:800;margin-top:6px}
  .card .v small{font-size:15px;font-weight:600;color:var(--muted)}
  .sec{margin:20px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .relay{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--panel);
         border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
  .relay .name{font-weight:700}
  .sw{position:relative;width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.14);border:none;cursor:pointer;transition:.2s}
  .sw.on{background:var(--lime)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on::after{left:27px}
  .cam{width:100%;border-radius:18px;border:1px solid var(--line);background:#000;aspect-ratio:16/9;object-fit:cover;margin-top:6px}
  .offline{background:rgba(245,165,36,.14);color:var(--amber);border:1px solid rgba(245,165,36,.3);
           border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
  footer{color:var(--muted);font-size:11px;text-align:center;margin-top:22px}
</style>
</head>
<body>
  <header>
    <div>
      <h1>Mahali<span>.</span></h1>
      <div class="sub" id="slug">{{SLUG}}</div>
    </div>
    <div class="pill" id="status">…</div>
  </header>

  <div class="offline" id="offline">⚠ Hors-ligne — affichage des dernières valeurs connues.</div>

  <div class="grid" id="sensors"></div>

  <div class="sec">Contrôle des relais</div>
  <div id="relays"></div>

  <div class="sec">Caméra en direct</div>
  <img class="cam" id="cam" alt="caméra" src="{{CAMERA}}"
       onerror="this.style.opacity=.3;this.alt='Caméra indisponible'">

  <footer>Contrôleur Mahali · fonctionne en local même sans Internet</footer>

<script>
  const LABELS = {
    temp_entry:["Température","°C","--amber"], temp_center:["Temp. centre","°C","--amber"],
    temp_exit:["Temp. sortie","°C","--amber"], humidity_entry:["Humidité","%","--cyan"],
    ph:["pH solution","","--lime"], water_level:["Réservoir","%","--blue"],
  };
  function fmt(v){ return v==null? "—" : (Math.round(v*10)/10); }

  async function tick(){
    try{
      const r = await fetch("/api/state"); const s = await r.json();
      const st = document.getElementById("status");
      const off = document.getElementById("offline");
      if(s.fresh){ st.className="pill on"; st.textContent="en direct"; off.style.display="none"; }
      else { st.className="pill off"; st.textContent="hors-ligne"; off.style.display="block"; }

      // Capteurs
      const g = document.getElementById("sensors"); g.innerHTML="";
      const keys = Object.keys(s.sensors||{});
      (keys.length?keys:Object.keys(LABELS)).forEach(k=>{
        const meta = LABELS[k] || [k,"",""];
        const val = s.sensors[k];
        g.insertAdjacentHTML("beforeend",
          `<div class="card"><div class="k">${meta[0]}</div>
           <div class="v">${val?fmt(val.value):"—"} <small>${(val&&val.unit)||meta[1]}</small></div></div>`);
      });

      // Relais
      const rd = document.getElementById("relays"); rd.innerHTML="";
      const relays = s.relays||{};
      Object.keys(relays).sort((a,b)=>a-b).forEach(ch=>{
        const rl = relays[ch];
        rd.insertAdjacentHTML("beforeend",
          `<div class="relay"><div class="name">${rl.name||("Relais "+ch)}</div>
           <button class="sw ${rl.is_on?"on":""}" onclick="toggle(${ch},${!rl.is_on})"></button></div>`);
      });
      if(!Object.keys(relays).length) rd.innerHTML='<div class="card"><div class="k">Aucun relais signalé</div></div>';
    }catch(e){
      document.getElementById("status").className="pill off";
      document.getElementById("status").textContent="hors-ligne";
    }
  }
  async function toggle(ch,state){
    try{ await fetch(`/api/relay/${ch}/toggle`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state})}); }catch(e){}
    setTimeout(tick,300);
  }
  // Kiosque écran : après 3 min sans interaction, on revient en haut du
  // tableau de bord (au cas où quelqu'un a scrollé/navigué sur l'écran).
  let lastTouch = Date.now();
  ["click","touchstart","scroll","keydown","mousemove"].forEach(ev=>
    window.addEventListener(ev,()=>lastTouch=Date.now(),{passive:true}));
  setInterval(()=>{ if(Date.now()-lastTouch>180000){ window.scrollTo(0,0); lastTouch=Date.now(); } },5000);

  tick(); setInterval(tick,3000);
  // Recharge la caméra si elle tombe (revient après coupure).
  setInterval(()=>{ const c=document.getElementById("cam"); c.src="{{CAMERA}}?t="+Date.now(); },180000);
</script>
</body>
</html>
